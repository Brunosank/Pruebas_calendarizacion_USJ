name: Monitor USJ Klook

on:
  schedule:
    # 1. Ráfaga cada 5 minutos entre las 12:00 AM y 12:55 AM hora de Japón (15:00 a 15:55 UTC)
    - cron: '*/5 15 * * *'
    # 2. El resto del día, solo una vez por hora (a los 0 minutos de cada hora)
    - cron: '0 0-14,16-23 * * *'
  workflow_dispatch:

jobs:
  check-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de monitoreo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          FECHA_OBJETIVO: "2026-10-16"
        run: python monitor_usj.py

      - name: Guardar estado actualizado en el repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update state.json [skip ci]" && git push)
